{% extends "base.html" %}

{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h3>🔒 Change Password</h3>
                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        <!-- Old Password -->
                        <div class="mb-3">
                            <label class="form-label">Old Password</label>
                            <div class="input-group">
                                {{ form.old_password }}
                                <button type="button"
                                        class="btn btn-outline-secondary"
                                        onclick="togglePassword('id_old_password', this)">
                                    👁
                                </button>
                            </div>
                            <div class="text-danger">
                                {{ form.old_password.errors }}
                            </div>
                        </div>

                        <!-- New Password -->
                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <div class="input-group">
                                {{ form.new_password1 }}
                                <button type="button"
                                        class="btn btn-outline-secondary"
                                        onclick="togglePassword('id_new_password1', this)">
                                    👁
                                </button>
                            </div>
                            <div class="text-danger">
                                {{ form.new_password1.errors }}
                            </div>
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-3">
                            <label class="form-label">Confirm New Password</label>
                            <div class="input-group">
                                {{ form.new_password2 }}
                                <button type="button"
                                        class="btn btn-outline-secondary"
                                        onclick="togglePassword('id_new_password2', this)">
                                    👁
                                </button>
                            </div>
                            <div class="text-danger">
                                {{ form.new_password2.errors }}
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">

                            <button type="submit" class="btn btn-success">
                                Update Password
                            </button>

                            <a href="{% url 'profile' %}" class="btn btn-secondary">
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>
</div>

<script>
    // Add Bootstrap class to Django-generated inputs
    document.getElementById("id_old_password").classList.add("form-control");
    document.getElementById("id_new_password1").classList.add("form-control");
    document.getElementById("id_new_password2").classList.add("form-control");

    function togglePassword(fieldId, button) {
        const input = document.getElementById(fieldId);

        if (input.type === "password") {
            input.type = "text";
            button.innerHTML = "🙈";
        } else {
            input.type = "password";
            button.innerHTML = "👁";
        }
    }
</script>

{% endblock %}
