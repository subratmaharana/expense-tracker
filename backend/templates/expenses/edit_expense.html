{% extends "base.html" %}

{% block title %}Edit Expense{% endblock %}

{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5">

                    <h2 class="fw-bold mb-2">✏ Edit Expense</h2>
                    <p class="text-secondary mb-4">Update your expense details.</p>

                    <form method="POST">
                        {% csrf_token %}

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Title</label>
                                <input type="text" name="title" class="form-control" value="{{ expense.title }}" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Amount (₹)</label>
                                <input type="number" step="0.01" name="amount" class="form-control" value="{{ expense.amount }}" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Transaction Type</label>
                                <select name="transaction_type" class="form-select">
                                    <option value="Expense" {% if expense.transaction_type == "Expense" %}selected{% endif %}>Expense</option>
                                    <option value="Income" {% if expense.transaction_type == "Income" %}selected{% endif %}>Income</option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Category</label>
                                <select name="category" class="form-select">
                                    {% for category in categories %}
                                    <option value="{{ category.id }}" {% if category.id == expense.category.id %}selected{% endif %}>{{ category.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Date</label>
                            <input type="date" name="date" class="form-control" value="{{ expense.date|date:'Y-m-d' }}" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Description</label>
                            <textarea name="description" rows="4" class="form-control">{{ expense.description }}</textarea>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">💾 Update Expense</button>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
