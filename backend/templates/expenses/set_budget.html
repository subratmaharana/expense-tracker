{% extends "base.html" %}

{% block title %}
Set Budget
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card p-4">

        <h2 class="mb-4">
            💰 Monthly Budget
        </h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn btn-success">

                Save Budget

            </button>

        </form>

    </div>

</div>

{% endblock %}
