{% extends "base.html" %}

{% block title %}
Add Expense
{% endblock %}

{% block content %}

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow-lg border-0">

<div class="card-body p-5">

<h2 class="fw-bold mb-2">
💸 Add New Transaction
</h2>

<p class="text-secondary mb-4">
Record your income or expense quickly and keep your finances organized.
</p>

<form method="POST">

{% csrf_token %}

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label fw-semibold">
Title
</label>

<input
type="text"
name="title"
class="form-control"
placeholder="e.g. Pizza, Salary, Fuel"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label fw-semibold">
Amount (₹)
</label>

<input
type="number"
step="0.01"
name="amount"
class="form-control"
placeholder="Enter amount"
required>

</div>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label fw-semibold">
Transaction Type
</label>

<select
name="transaction_type"
class="form-select">

<option value="Expense">
Expense
</option>

<option value="Income">
Income
</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label fw-semibold">
Category
</label>

<select
name="category"
class="form-select">

{% for category in categories %}

<option value="{{ category.id }}">
{{ category.name }}
</option>

{% endfor %}

</select>

</div>

</div>

<div class="mb-3">

<label class="form-label fw-semibold">
Transaction Date
</label>

<input
type="date"
name="date"
class="form-control"
required>

</div>

<div class="mb-4">

<label class="form-label fw-semibold">
Description
</label>

<textarea
name="description"
rows="4"
class="form-control"
placeholder="Optional notes..."></textarea>

</div>

<div class="d-grid">

<button
class="btn btn-success btn-lg">

💾 Save Transaction

</button>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
