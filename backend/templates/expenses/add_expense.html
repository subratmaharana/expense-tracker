{% extends "base.html" %}

{% block title %}
Add Expense
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0">

                <div class="card-body p-5">

                    <h2 class="fw-bold mb-2">
                        💸 Add Expense
                    </h2>

                    <p class="text-secondary mb-4">
                        Record your expenses and track where your money is spent.
                    </p>

                    <form method="POST">

                        {% csrf_token %}

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Title
                                </label>

                                <input
                                    type="text"
                                    name="title"
                                    class="form-control"
                                    placeholder="e.g. Pizza, Fuel, Movie"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Amount (₹)
                                </label>

                                <input
                                    type="number"
                                    step="0.01"
                                    name="amount"
                                    class="form-control"
                                    placeholder="Enter amount"
                                    required>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Category
                                </label>

                                <select
                                    name="category"
                                    class="form-select"
                                    required>

                                    {% for category in categories %}

                                    <option value="{{ category.id }}">
                                        {{ category.name }}
                                    </option>

                                    {% endfor %}

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Paid From
                                </label>

                                <select
                                    name="paid_from"
                                    class="form-select"
                                    required>

                                    {% for income in income_sources %}

                                    <option value="{{ income.id }}">
                                        {{ income.source }} (₹{{ income.amount }})
                                    </option>

                                    {% empty %}

                                    <option disabled selected>
                                        No Income Source Found
                                    </option>

                                    {% endfor %}

                                </select>

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Expense Date
                            </label>

                            <input
                                type="date"
                                name="date"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Description
                            </label>

                            <textarea
                                name="description"
                                rows="4"
                                class="form-control"
                                placeholder="Optional notes..."></textarea>

                        </div>

                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-success btn-lg">

                                💾 Save Expense

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
