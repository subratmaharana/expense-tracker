{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Income Sources</h2>

    <a href="{% url 'add_income' %}" class="btn btn-success mb-3">
        Add Income Source
    </a>

    <table class="table table-bordered">

        <tr>
            <th>Source</th>
            <th>Amount</th>
        </tr>

        {% for income in incomes %}

        <tr>
            <td>{{ income.source }}</td>
            <td>₹{{ income.amount }}</td>
        </tr>

        {% empty %}

        <tr>
            <td colspan="2">No income source added.</td>
        </tr>

        {% endfor %}

    </table>

    <h4>Total Income : ₹{{ total_income }}</h4>

</div>

{% endblock %}
