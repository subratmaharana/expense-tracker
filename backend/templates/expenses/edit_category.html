{% extends "base.html" %}

{% block title %}
Edit Category
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card p-4">

        <h2>Edit Category</h2>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">Category Name</label>

                <input
                    type="text"
                    name="name"
                    value="{{ category.name }}"
                    class="form-control"
                    required>

            </div>

            <button class="btn btn-primary">
                Update Category
            </button>

        </form>

    </div>

</div>

{% endblock %}
